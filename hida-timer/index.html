<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>飛騨商談会 タイムキーパー</title>
<style>
  :root{ --bg:#1e293b; --prep:#2563eb; --talk:#15803d; --warn:#ea580c; --move:#6d28d9; --brk:#0f766e; --info:#334155; }
  *{box-sizing:border-box;margin:0;padding:0;min-width:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:var(--bg); color:#fff; transition:background-color .6s ease;
    display:flex; flex-direction:column; min-height:100%; overflow-x:clip;
    -webkit-user-select:none; user-select:none;
  }
  body.p-talk{--bg:var(--talk)} body.p-warn{--bg:var(--warn)} body.p-move{--bg:var(--move)}
  body.p-prep{--bg:var(--prep)} body.p-break{--bg:var(--brk)} body.p-info{--bg:var(--info)}
  body.flash{animation:flash .9s ease 2}
  @keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.55)}}
  @media (prefers-reduced-motion:reduce){body.flash{animation:none}}

  header{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;
    padding:calc(10px + env(safe-area-inset-top)) 20px 8px}
  .title{font-weight:700;font-size:clamp(14px,2vw,20px);opacity:.92}
  .hr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:clamp(14px,2vw,20px)}
  .delay{background:rgba(0,0,0,.28);padding:3px 10px;border-radius:99px;font-size:.85em;font-weight:700}
  .delay:empty{display:none}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 16px;text-align:center}
  .round{font-size:clamp(20px,3.6vw,40px);font-weight:800;letter-spacing:.04em}
  .badge{display:inline-flex;align-items:center;gap:.5em;margin-top:.3em;font-size:clamp(16px,2.6vw,28px);font-weight:700}
  .badge b{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:6px;background:#fff;color:#111}
  .badge b.A{background:#dc2626;color:#fff} .badge b.B{background:#111;color:#fff;outline:2px solid #fff}
  .badge:empty{display:none}
  .phase{font-size:clamp(30px,6.5vw,80px);font-weight:800;margin:.12em 0 0;letter-spacing:.05em}
  .sub{font-size:clamp(14px,2.2vw,24px);opacity:.9}
  .time{font-size:clamp(90px,24vw,320px);font-weight:800;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .time.long{font-size:clamp(70px,17vw,240px)}
  .msg{font-size:clamp(18px,3.4vw,40px);font-weight:800;min-height:1.35em}
  .next{font-size:clamp(14px,2.2vw,24px);opacity:.9;margin-top:.3em}
  .bar{width:min(900px,92vw);height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:14px}
  .bar>div{height:100%;width:0;background:#fff;border-radius:99px}

  .timeline{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 16px 4px}
  .timeline span{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;background:rgba(255,255,255,.16)}
  .timeline span.done{background:rgba(255,255,255,.55);color:#1e293b}
  .timeline span.now{background:#fff;color:#1e293b;outline:3px solid rgba(255,255,255,.6);outline-offset:2px}
  .timeline i{width:10px;align-self:center;height:3px;background:rgba(255,255,255,.5);border-radius:2px}

  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  button{font:inherit;font-weight:700;font-size:clamp(14px,1.8vw,17px);border:none;border-radius:12px;padding:11px 16px;min-height:44px;
    cursor:pointer;background:rgba(255,255,255,.18);color:#fff}
  button:hover{background:rgba(255,255,255,.3)}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  button.primary{background:#fff;color:#1e293b;min-width:130px}

  /* 起動画面 */
  #gate{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:24px}
  #gate h1{font-size:clamp(24px,4vw,44px)}
  #gate p{opacity:.85;max-width:560px;line-height:1.7}
  #gate #gateBtn{font-size:24px;padding:20px 40px}
  #gate p b{white-space:nowrap}
  #gate.hide{display:none}

  dialog{margin:auto;border:none;border-radius:16px;padding:0;width:min(640px,95vw);color:#1e293b;max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dlg{padding:20px;overflow:auto;max-height:92vh}
  .dlg h2{font-size:20px;margin-bottom:10px}
  .dlg p.note{font-size:13px;color:#475569;margin-bottom:10px;line-height:1.6}
  .dlg button{background:#e2e8f0;color:#1e293b}
  .dlg button.primary{background:#6d28d9;color:#fff}
  .dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #e2e8f0}
  .row label{font-weight:600;font-size:15px}
  .row small{display:block;font-weight:400;color:#64748b;font-size:12px}
  .row input[type=number]{width:90px;font:inherit;font-size:16px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;text-align:right}
  .row input[type=text]{width:min(300px,55vw);font:inherit;font-size:16px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px}
  .row input[type=checkbox]{width:22px;height:22px}
  .row select{font:inherit;font-size:15px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;max-width:min(320px,55vw)}
  .row input[type=range]{width:min(220px,45vw)}
  textarea{width:100%;height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}
  #err{color:#dc2626;font-size:13px;font-weight:700;margin-top:6px}

  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:8px 6px;border-bottom:1px solid #e2e8f0;text-align:left}
  th{background:#111;color:#fff;font-size:13px}
  td.t{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700;color:#b91c1c}
  tr.cur td{background:#ede9fe}
  tr.gray td{background:#f1f5f9;color:#334155;font-size:13px}
  td .gb{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:12px}
  td .gb.A{background:#dc2626} td .gb.B{background:#111}
  td button{padding:6px 10px;min-height:36px;font-size:13px}
</style>
</head>
<body class="p-info">

<div id="gate">
  <h1 id="gateTitle">飛騨商談会 タイムキーパー</h1>
  <div id="gateClock" style="font-size:clamp(18px,3vw,28px);font-variant-numeric:tabular-nums;opacity:.85"></div>
  <p id="gateInfo"></p>
  <button id="gateBtn" class="primary">▶ 第1セッション スタート</button>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button id="gateList">📋 途中のセッションから始める</button>
    <button id="gateTest">🔔 音テスト</button>
    <button id="gateSet">⚙ 設定</button>
  </div>
</div>

<header>
  <div class="title" id="title">飛騨商談会 タイムキーパー</div>
  <div class="hr"><span class="delay" id="delay"></span><span id="clock">--:--:--</span></div>
</header>

<main>
  <div class="round" id="round"></div>
  <div class="badge" id="badge"></div>
  <div class="phase" id="phase"></div>
  <div class="sub" id="sub"></div>
  <div class="time" id="time">--:--</div>
  <div class="msg" id="msg"></div>
  <div class="next" id="next"></div>
  <div class="bar"><div id="bar"></div></div>
</main>

<div class="timeline" id="timeline"></div>

<div class="controls">
  <button id="btnPause" class="primary">⏸ 一時停止</button>
  <button id="btnMinus" title="残り時間を30秒減らす">−30秒</button>
  <button id="btnPlus" title="残り時間を30秒増やす（以降も後ろにずれます）">＋30秒</button>
  <button id="btnSkip" title="次の区切りへ進む">次へ ⏭</button>
  <button id="btnSync" title="遅れ・早まりをなくして時間表どおりに戻す">⟲ 予定時刻に戻す</button>
  <button id="btnReset" title="スタート前の画面に戻る">⏹ 最初に戻す</button>
  <button id="btnList">📋 時間表</button>
  <button id="btnTest">🔔 音テスト</button>
  <button id="btnSettings">⚙ 設定</button>
  <button id="btnFull">⛶ 全画面</button>
</div>

<dialog id="dlgList">
  <div class="dlg">
    <h2>📋 商談時間表</h2>
    <p class="note">「ここから」を押すと、<b>押した瞬間にそのセッションが始まり</b>、以降は時間表どおり（入れ替え2分・休憩込み）に進みます。</p>
    <table><thead><tr><th>回</th><th>セラー</th><th>方式</th><th>開始</th><th>終了</th><th></th></tr></thead><tbody id="listBody"></tbody></table>
    <div class="btns"><button id="listClose">閉じる</button></div>
  </div>
</dialog>

<dialog id="dlgSet">
  <form method="dialog" class="dlg" id="form">
    <h2>⚙ 設定</h2>
    <div class="row"><label>タイトル</label><input type="text" id="sTitle"></div>
    <div class="row"><label>終了前の予告（分）<small>例：1 →「残り1分です」</small></label><input type="number" id="sWarn" min="0" max="10" step="0.5"></div>
    <div class="row"><label>開始前のアナウンス<small>開始1分前・10秒前・3・2・1</small></label><input type="checkbox" id="sPre"></div>
    <div class="row"><label>休憩で遅れを調整<small>遅れていても休憩明けは予定時刻に戻します（休憩が5分以上残る場合）</small></label><input type="checkbox" id="sAbsorb"></div>
    <div class="row"><label>音声アナウンス</label><input type="checkbox" id="sVoice"></div>
    <div class="row"><label>声の種類<small>★が付いた声ほど自然です（端末により異なります）</small></label><select id="sVoiceName"></select></div>
    <div class="row"><label>話す速さ <span id="rateV"></span></label><input type="range" id="sRate" min="0.7" max="1.3" step="0.05"></div>
    <div class="row"><label>声の高さ <span id="pitchV"></span></label><input type="range" id="sPitch" min="0.7" max="1.3" step="0.05"></div>
    <div class="row"><label>試しに聞く</label><button type="button" id="btnPreview">▶ 試聴</button></div>
    <div class="row"><label>チャイム音</label><input type="checkbox" id="sChime"></div>
    <div style="padding-top:10px">
      <label style="font-weight:600">時間表</label>
      <p class="note" style="margin:4px 0 0">1行に1項目。<code>開始-終了 名前｜グループ｜方式</code>。名前に「セッション」が入ると商談、「休憩」が入ると休憩として扱います。終了時刻を省くと、その後ずっと続く項目になります。</p>
      <textarea id="sSched" spellcheck="false"></textarea>
      <div id="err"></div>
    </div>
    <div class="btns">
      <button type="button" id="btnDefault">時間表を初期値に戻す</button>
      <button value="cancel" formnovalidate>キャンセル</button>
      <button value="ok" class="primary" id="saveBtn">保存</button>
    </div>
  </form>
</dialog>

<script>
{
const DEFAULT_SCHED = `13:00-13:10 開会｜1.あいさつ（飛騨市）　2.配布資料の確認と商談方法の説明
13:15-13:25 第01セッション｜A｜事前マッチング
13:27-13:37 第02セッション｜B｜事前マッチング
13:39-13:49 第03セッション｜A｜自由商談
13:51-14:01 第04セッション｜B｜自由商談
14:03-14:13 第05セッション｜A｜自由商談
14:15-14:25 第06セッション｜B｜自由商談
14:25-14:40 休憩
14:40-14:50 第07セッション｜A｜自由商談
14:52-15:02 第08セッション｜B｜自由商談
15:04-15:14 第09セッション｜A｜自由商談
15:16-15:26 第10セッション｜B｜自由商談
15:28-15:38 第11セッション｜A｜自由商談
15:38-15:55 休憩
15:55-16:05 第12セッション｜B｜自由商談
16:07-16:17 第13セッション｜A｜自由商談
16:19-16:29 第14セッション｜B｜自由商談
16:31-16:41 第15セッション｜A｜自由商談
16:43-16:53 第16セッション｜B｜自由商談
16:55- 諸連絡｜4.意見交換会等のご案内　※終了後、バイヤーは貸切バスでひだホテルプラザへご案内`;
const DEFAULTS = { title:"飛騨地域インバウンド観光商談会 2026", warn:1, pre:true, absorb:true, voice:true, voiceName:"", rate:0.95, pitch:1.0, chime:true, sched:DEFAULT_SCHED };
const KEY = "hidaTimer.v2";
let S = Object.assign({}, DEFAULTS);
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); }catch(e){}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ===== 時間表の読み込み =====
function parseSched(text){
  const ev = [], errs = [];
  text.split(/\r?\n/).forEach((line, i) => {
    const L = line.trim(); if (!L) return;
    const m = L.match(/^(\d{1,2})[:：](\d{2})\s*[-~〜ー－]\s*(?:(\d{1,2})[:：](\d{2}))?\s*(.*)$/);
    if (!m){ errs.push(`${i+1}行目が読み取れません：${L}`); return; }
    const start = (+m[1]*60 + +m[2]) * 60000;
    const end = m[3] != null ? (+m[3]*60 + +m[4]) * 60000 : Infinity;
    if (end <= start){ errs.push(`${i+1}行目：終了が開始より前です`); return; }
    const parts = m[5].split(/[｜|]/).map(s => s.trim());
    const name = parts[0] || "（無題）";
    const type = /セッション/.test(name) ? "talk" : /休憩/.test(name) ? "break" : "info";
    const e = { start, end, name, type };
    if (type === "talk"){ e.group = (parts[1]||"").replace(/グループ$/,""); e.method = parts[2]||""; e.no = (name.match(/\d+/)||[""])[0].replace(/^0+(?=\d)/,""); }
    else e.detail = parts.slice(1).join("　");
    ev.push(e);
  });
  ev.sort((a,b) => a.start - b.start);
  for (let i = 1; i < ev.length; i++) if (ev[i].start < ev[i-1].end) errs.push(`${ev[i].name} が前の項目と時間が重なっています`);
  return { ev, errs };
}
let EV = [], PH = [];
function build(){
  EV = parseSched(S.sched).ev;
  PH = [];
  if (!EV.length) return;
  PH.push({ type:"wait", start:-Infinity, end:EV[0].start });
  EV.forEach((e, i) => {
    PH.push(Object.assign({}, e, { ev:e }));
    const n = EV[i+1];
    if (n && n.start > e.end) PH.push({ type: n.type === "talk" ? "move" : "gap", start:e.end, end:n.start });
  });
  const last = EV[EV.length-1];
  if (last.end !== Infinity) PH.push({ type:"done", start:last.end, end:Infinity });
  PH.forEach((p, i) => {
    p.i = i; p.next = PH[i+1];
    p.cues = [];
    if (p.next && p.next.type === "talk" && S.pre){
      const t = p.next, len = p.end - p.start;
      if (len > 60000) p.cues.push({ at:60000, snd:"chime", msg:"開始1分前",
        say:`${spoken(t)}、開始1分前です。${t.group?t.group+"グループの皆さま、":""}ご準備ください。` });
      if (len > 10000) p.cues.push({ at:10000, snd:"chime", msg:"開始10秒前", say:"開始10秒前です。" });
      [3,2,1].forEach(n => p.cues.push({ at:n*1000, snd:"tick" }));
    }
    if (p.type === "talk" && S.warn > 0 && S.warn*60000 < p.end - p.start)
      p.cues.push({ at:S.warn*60000, snd:"chime2", msg:`残り${minJa(S.warn)}`, say:`残り${minJa(S.warn)}です。` });
  });
}
const spoken = e => e.no ? `第${e.no}セッション` : e.name;
const minJa = m => m >= 1 ? (Number.isInteger(m) ? `${m}分` : `${Math.floor(m)}分${Math.round(m%1*60)}秒`) : `${Math.round(m*60)}秒`;
const hm = ms => { const t = Math.round(ms/60000); return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; };
const hmSay = ms => { const t = Math.round(ms/60000), h = Math.floor(t/60), m = t%60; return `${h}時${m ? m+"分" : ""}`; };

// ===== 時間の管理（offset = 予定からの遅れ） =====
let offset = 0, paused = false, pausedAt = 0;
function midnight(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function realNow(){ return paused ? pausedAt : Date.now(); }
function schedNow(){ return realNow() - offset - midnight(); }   // 時間表上の「今」
function phaseAt(t){ return PH.find(p => t >= p.start && t < p.end) || PH[PH.length-1]; }

// ===== 音 =====
let ac = null;
function audio(){ try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); }catch(e){} return ac; }
function tone(f, st, d, v=0.35, type="sine"){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + st;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0+0.02); g.gain.exponentialRampToValueAtTime(0.001, t0+d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+d+0.05);
}
const SND = {
  chime:  () => { tone(880,0,1.0); tone(659,.45,1.4); },
  chime2: () => { tone(988,0,.5); tone(988,.35,.5); tone(988,.7,1.0); },
  tick:   () => tone(1200,0,.15,.3,"square"),
  start:  () => { tone(523,0,.4); tone(659,.18,.4); tone(784,.36,.4); tone(1047,.54,1.4); },
  end:    () => [0,.5,1.0].forEach(t => { tone(523,t,1.2,.4,"triangle"); tone(784,t,1.2,.2,"triangle"); }),
};
function play(n){ if (S.chime && SND[n]) try{ SND[n](); }catch(e){} }
let sayTimer = null;
function say(text, delay=0){
  if (!S.voice || !text || !("speechSynthesis" in window)) return;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => { try{
    const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP";
    const v = pickVoice(S.voiceName); if (v){ u.voice = v; u.lang = v.lang; }
    u.rate = S.rate || 0.95; u.pitch = S.pitch || 1; u.volume = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){} }, delay);
}
// 日本語の声を品質順に並べる（ニューラル音声・高品質音声を優先）
function voiceScore(v){
  const n = v.name; let sc = 0;
  if (/Natural|Neural|Online/i.test(n)) sc += 60;           // Edge のニューラル音声（Nanami など）
  if (/Premium|Enhanced|プレミアム|拡張/i.test(n)) sc += 50;  // Apple の高品質音声
  if (/Google/i.test(n)) sc += 35;
  if (/Nanami|Kyoko|O-?ren|Hattori|Otoya/i.test(n)) sc += 10;
  if (/Ichiro|Ayumi|Sayaka/i.test(n)) sc -= 5;
  return sc;
}
function jaVoices(){
  try{ return speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)).sort((a,b) => voiceScore(b) - voiceScore(a)); }catch(e){ return []; }
}
function pickVoice(name){ const vs = jaVoices(); return (name && vs.find(v => v.name === name)) || vs[0] || null; }
function fillVoices(){
  const sel = $("sVoiceName"), vs = jaVoices(), keep = sel.value || S.voiceName;
  if (!vs.length){ sel.innerHTML = `<option value="">（日本語の声が見つかりません）</option>`; return; }
  sel.innerHTML = `<option value="">おまかせ（${esc(vs[0].name)}）</option>` +
    vs.map(v => `<option value="${esc(v.name)}">${voiceScore(v) >= 35 ? "★ " : ""}${esc(v.name)}</option>`).join("");
  sel.value = vs.some(v => v.name === keep) ? keep : "";
}
try{ speechSynthesis.addEventListener("voiceschanged", fillVoices); }catch(e){}
let wakeLock = null;
async function keepAwake(){ try{ if ("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } }catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

// ===== 進行 =====
let cur = null, fired = new Set(), started = false, quiet = false;
function onEnter(p, prev, natural){
  fired = new Set();
  const rem = p.end - schedNow();
  p.cues.forEach((c,k) => { if (c.at > rem + 300) fired.add(k); });
  $("msg").textContent = "";
  if (!natural || !started) return;
  if (p.type === "talk"){
    play("start"); say(`${spoken(p)}、開始です。`, 1000); setMsg("開始！");
  } else if (prev && prev.type === "talk"){
    play("end");
    const nt = PH.slice(p.i).find(x => x.type === "talk");
    if (p.type === "break"){
      if (S.absorb && offset > 0 && (p.end + midnight()) - Date.now() >= 5*60000 && !paused){ offset = 0; }
      say(`終了です。ここから休憩です。${nt ? `次は${hmSay(nt.start + offset)}から、${spoken(nt)}を始めます。` : ""}`, 1700);
      setMsg("終了！ 休憩です");
    } else if (p.type === "move"){
      say("終了です。入れ替えをお願いします。", 1700); setMsg("終了！ 入れ替えてください");
    } else {
      say("終了です。商談はすべて終了しました。お疲れさまでした。", 1700); setMsg("全セッション終了");
    }
  } else if (p.type === "info" || p.type === "break"){
    play("chime"); say(p.type === "break" ? "休憩です。" : `${p.name}です。`, 1300);
  }
}
function setMsg(t){ $("msg").textContent = t; flash(); }

function tick(){
  if (!started){ renderGate(); return; }
  if (!PH.length){ render(); return; }
  const t = schedNow(), p = phaseAt(t);
  if (p !== cur){
    const prev = cur, natural = !quiet && prev && p.i === prev.i + 1;
    cur = p; quiet = false;
    onEnter(p, prev, natural);
  } else if (!paused && started){
    const rem = p.end - t;
    p.cues.forEach((c,k) => {
      if (fired.has(k) || rem > c.at) return;
      fired.add(k);
      if (rem > c.at - 1500){ play(c.snd); if (c.say) say(c.say, c.snd === "tick" ? 0 : 1300); if (c.msg) setMsg(c.msg); }
    });
  }
  render();
}

function fmt(ms){
  const s = Math.max(0, Math.ceil(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}` : `${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`;
}
const realHM = schedMs => hm(schedMs + offset);   // 遅れを反映した実際の時刻
function timeLabel(e){ return offset && Math.abs(offset) >= 30000 ? `${realHM(e.start)}〜（予定 ${hm(e.start)}）` : `${hm(e.start)}〜`; }

function render(){
  const now = new Date(realNow());
  $("clock").textContent = "🕒 " + new Date().toLocaleTimeString("ja-JP");
  const d = Math.round(offset/1000);
  $("delay").textContent = paused ? "⏸ 一時停止中" 
    : Math.abs(d) < 5 ? "" : Math.abs(d) >= 600 ? "時間表とずらして進行中（リハーサル）" : d > 0 ? `予定より ${fmtDelay(d)} 遅れ` : `予定より ${fmtDelay(-d)} 早い`;
  $("btnPause").textContent = paused ? "▶ 再開" : "⏸ 一時停止";
  if (!cur) return;
  const p = cur, t = schedNow(), rem = p.end - t;
  let cls = { talk:"p-talk", move:"p-move", break:"p-break", info:"p-info", wait:"p-info", gap:"p-info", done:"p-info" }[p.type];
  if (p.type === "talk" && S.warn > 0 && rem <= S.warn*60000) cls = "p-warn";
  if (p.next && p.next.type === "talk" && rem <= 60000 && p.type !== "talk") cls = "p-prep";
  if (!document.body.classList.contains(cls)) document.body.className = cls + (document.body.classList.contains("flash") ? " flash" : "");

  const nt = PH.slice(p.i + (p.type === "talk" ? 1 : 0)).find(x => x.type === "talk");
  const talks = EV.filter(e => e.type === "talk");
  let round = "", badge = "", phase = "", sub = "";
  if (p.type === "talk"){
    round = `${p.name}（全${talks.length}）`;
    badge = p.group ? `<b class="${esc(p.group)}">${esc(p.group)}</b>${esc(p.group)}グループ${p.method ? "・" + esc(p.method) : ""}` : "";
    phase = "商談中"; sub = `${realHM(p.start)} 〜 ${realHM(p.end)}`;
  } else if (p.type === "move"){
    round = `次：${nt.name}`; badge = nt.group ? `<b class="${esc(nt.group)}">${esc(nt.group)}</b>${esc(nt.group)}グループ${nt.method ? "・" + esc(nt.method) : ""}` : "";
    phase = "入れ替え・開始まで"; sub = `${realHM(nt.start)} 開始`;
  } else if (p.type === "break"){
    round = "休憩"; phase = "休憩中"; sub = `${realHM(p.start)} 〜 ${realHM(p.end)}${nt && nt.start === p.end ? `　→ ${nt.name}（${nt.group||""}グループ）` : ""}`;
  } else if (p.type === "wait"){
    round = S.title; phase = `${EV[0].name}まで`; sub = `${realHM(EV[0].start)} 開始`;
  } else if (p.type === "done"){
    round = S.title; phase = "終了しました"; sub = "お疲れさまでした";
  } else { // info / gap
    round = p.type === "gap" ? "" : `${realHM(p.start)}〜${p.end !== Infinity ? realHM(p.end) : ""}`;
    phase = p.type === "gap" ? `${p.next && p.next.name ? p.next.name : "次"}まで` : p.name; sub = p.detail || "";
  }
  $("round").textContent = round; $("badge").innerHTML = badge; $("phase").textContent = (paused ? "⏸ " : "") + phase; $("sub").textContent = sub;

  const tm = $("time");
  if (p.end === Infinity){ tm.textContent = now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}); tm.classList.add("long"); $("bar").style.width = "100%"; }
  else { const s = fmt(rem); tm.textContent = s; tm.classList.toggle("long", s.length > 5);
    $("bar").style.width = p.start === -Infinity ? "0" : `${Math.min(100, Math.max(0, (t - p.start)/(p.end - p.start)*100))}%`; }

  let nx = "";
  if (p.type === "talk"){ const n = p.next; nx = !n || n.type === "done" ? "次：全セッション終了" : n.type === "break" ? `次：休憩（${realHM(n.start)}〜${realHM(n.end)}）` : n.type === "move" && nt ? `次：${nt.name}（${nt.group}グループ）${timeLabel(nt)}` : `次：${n.name || ""}`; }
  else if (nt && p.type !== "move") nx = `次の商談：${nt.name}（${nt.group}グループ）${timeLabel(nt)}`;
  $("next").textContent = nx;
  renderTimeline(talks);
}
function renderGate(){
  $("gateClock").textContent = "🕒 現在 " + new Date().toLocaleTimeString("ja-JP");
  const f = firstTalk();
  $("gateInfo").innerHTML = f
    ? `スタートを押すと <b>${esc(f.name)}（${esc(f.group)}グループ${f.method ? "・" + esc(f.method) : ""}／予定 ${hm(f.start)}〜）</b> がすぐ始まります。<br>以降は時間表どおり、入れ替え2分・休憩を挟んで自動で進みます。`
    : "時間表にセッションがありません。⚙設定から入力してください。";
  $("gateBtn").disabled = !f;
}
function fmtDelay(s){ return s >= 60 ? `${Math.floor(s/60)}分${s%60 ? s%60+"秒" : ""}` : `${s}秒`; }
let lastTL = "";
function renderTimeline(talks){
  const t = schedNow();
  const html = talks.map((e,k) => {
    const c = t >= e.end ? "done" : t >= e.start ? "now" : "";
    const brk = EV.some(b => b.type === "break" && b.start >= e.end && talks[k+1] && b.end <= talks[k+1].start);
    return `<span class="${c}">${esc(e.no || k+1)}</span>${brk ? "<i title='休憩'></i>" : ""}`;
  }).join("");
  if (html !== lastTL){ $("timeline").innerHTML = html; lastTL = html; }
}
function flash(){ document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash"); setTimeout(() => document.body.classList.remove("flash"), 1900); }

// ===== 操作 =====
function setOffsetTo(schedTarget, isQuiet){ offset = realNow() - midnight() - schedTarget; quiet = isQuiet; tick(); }
function startAt(e){   // e の開始時刻 = 今 として進行開始
  audio(); keepAwake(); try{ speechSynthesis.getVoices(); }catch(x){}
  started = true; paused = false; $("gate").classList.add("hide");
  offset = Date.now() - midnight() - e.start;
  const ph = PH.find(p => p.start === e.start && p.type === e.type);
  cur = ph && ph.i > 0 ? PH[ph.i - 1] : null; quiet = false;   // 直前から「自然に」入ったことにして開始アナウンスを鳴らす
  if (!cur) quiet = true;
  tick();
}
const firstTalk = () => EV.find(e => e.type === "talk");
$("gateBtn").onclick = () => { const f = firstTalk(); if (f) startAt(f); };
$("gateList").onclick = () => $("btnList").click();
$("gateTest").onclick = () => $("btnTest").click();
$("gateSet").onclick = () => $("btnSettings").click();
let resetArmed = false;
$("btnReset").onclick = () => {
  if (!resetArmed){ resetArmed = true; $("btnReset").textContent = "もう一度押すと戻ります";
    setTimeout(() => { resetArmed = false; $("btnReset").textContent = "⏹ 最初に戻す"; }, 3000); return; }
  resetArmed = false; $("btnReset").textContent = "⏹ 最初に戻す";
  started = false; paused = false; offset = 0; cur = null;
  try{ speechSynthesis.cancel(); }catch(x){}
  $("gate").classList.remove("hide"); document.body.className = "p-info"; tick();
};
$("btnPause").onclick = () => {
  if (paused){ offset += Date.now() - pausedAt; paused = false; say("再開します。"); }
  else { pausedAt = Date.now(); paused = true; say("一時停止します。"); }
  tick();
};
$("btnPlus").onclick  = () => { offset += 30000; refire(); tick(); };
$("btnMinus").onclick = () => { offset -= 30000; tick(); };
function refire(){ if (!cur) return; const rem = cur.end - schedNow(); cur.cues.forEach((c,k) => { if (rem > c.at) fired.delete(k); }); }
$("btnSkip").onclick  = () => { if (cur && cur.next) setOffsetTo(cur.next.start, false); };
$("btnSync").onclick  = () => { offset = 0; quiet = true; if (paused) pausedAt = Date.now(); tick(); };
$("btnTest").onclick  = () => { audio(); play("chime"); say("音声テストです。第1セッション、開始1分前です。", 1300); };
$("btnFull").onclick  = () => { try{ const d = document.documentElement;
  if (!document.fullscreenElement){ const f = d.requestFullscreen || d.webkitRequestFullscreen; if (f){ const r = f.call(d); if (r && r.catch) r.catch(()=>{}); } }
  else document.exitFullscreen(); }catch(e){} };
document.addEventListener("keydown", e => {
  if (document.querySelector("dialog[open]") || !started) return;
  if (e.code === "Space"){ e.preventDefault(); $("btnPause").click(); }
  else if (e.key === "ArrowRight") $("btnSkip").click();
  else if (e.key === "ArrowUp") $("btnPlus").click();
  else if (e.key === "ArrowDown") $("btnMinus").click();
  else if (e.key === "f") $("btnFull").click();
});

// 時間表ダイアログ
$("btnList").onclick = () => {
  const t = schedNow();
  $("listBody").innerHTML = EV.map((e, k) => {
    const c = t >= e.start && t < e.end ? "cur" : "";
    if (e.type !== "talk") return `<tr class="gray ${c}"><td colspan="3">${esc(e.name)}${e.detail ? "　" + esc(e.detail) : ""}</td><td class="t">${hm(e.start)}</td><td class="t">${e.end === Infinity ? "" : hm(e.end)}</td><td><button data-k="${k}">ここから</button></td></tr>`;
    return `<tr class="${c}"><td>${esc(e.name)}</td><td>${e.group ? `<span class="gb ${esc(e.group)}">${esc(e.group)}</span> ` : ""}${esc(e.group)}グループ</td><td>${esc(e.method)}</td><td class="t">${hm(e.start)}</td><td class="t">${hm(e.end)}</td><td><button data-k="${k}">ここから</button></td></tr>`;
  }).join("");
  $("dlgList").showModal();
};
$("listBody").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-k]"); if (!b) return;
  const e = EV[+b.dataset.k];
  $("dlgList").close();
  startAt(e);
});
$("listClose").onclick = () => $("dlgList").close();

// 設定ダイアログ
const F = { sTitle:"title", sWarn:"warn", sPre:"pre", sAbsorb:"absorb", sVoice:"voice", sVoiceName:"voiceName", sRate:"rate", sPitch:"pitch", sChime:"chime", sSched:"sched" };
const showRange = () => { $("rateV").textContent = "×" + (+$("sRate").value).toFixed(2); $("pitchV").textContent = "×" + (+$("sPitch").value).toFixed(2); };
$("sRate").addEventListener("input", showRange); $("sPitch").addEventListener("input", showRange);
$("btnPreview").onclick = () => {
  const keep = { voice:S.voice, voiceName:S.voiceName, rate:S.rate, pitch:S.pitch };
  Object.assign(S, { voice:true, voiceName:$("sVoiceName").value, rate:+$("sRate").value, pitch:+$("sPitch").value });
  say("第1セッション、開始1分前です。Aグループの皆さま、ご準備ください。");
  setTimeout(() => Object.assign(S, keep), 300);
};
$("btnSettings").onclick = () => {
  fillVoices();
  for (const [id,k] of Object.entries(F)){ const el = $(id); if (el.type === "checkbox") el.checked = !!S[k]; else el.value = S[k]; }
  if (![...$("sVoiceName").options].some(o => o.value === S.voiceName)) $("sVoiceName").value = "";
  showRange();
  $("err").textContent = ""; $("dlgSet").showModal();
};
$("btnDefault").onclick = () => { $("sSched").value = DEFAULT_SCHED; checkSched(); };
function checkSched(){ const r = parseSched($("sSched").value); $("err").textContent = r.errs.join(" ／ ") || (r.ev.length ? "" : "時間表が空です"); return !r.errs.length && r.ev.length; }
$("sSched").addEventListener("input", checkSched);
$("saveBtn").addEventListener("click", e => { if (!checkSched()) e.preventDefault(); });
$("dlgSet").addEventListener("close", () => {
  if ($("dlgSet").returnValue !== "ok") return;
  for (const [id,k] of Object.entries(F)){ const el = $(id); S[k] = el.type === "checkbox" ? el.checked : (el.type === "number" || el.type === "range") ? Math.max(0, parseFloat(el.value)||0) : el.value; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  applyTitle(); build(); cur = null; quiet = true; lastTL = ""; tick();
});
function applyTitle(){ $("title").textContent = S.title; $("gateTitle").textContent = S.title; document.title = S.title; }

applyTitle(); build(); tick();
setInterval(tick, 200);
}
</script>
